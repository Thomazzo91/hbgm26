<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HBGM 26" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Körrutter för tidtagningsmattor, Helsingborg Marathon 2026." />
  <title>HBGM 26 · Mattor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111824;
      --line: #2a3440;
      --text: #f4f7fb;
      --muted: #9aa6b4;
      --soder: #f59e0b;
      --mitten: #3b82f6;
      --norr: #10b981;
      --accent: #3b82f6;
      --header-h: calc(52px + env(safe-area-inset-top));
      --sheet: min(46dvh, 380px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: manipulation;
    }
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
      background: linear-gradient(to bottom, rgba(11,18,32,.94), rgba(11,18,32,.45) 78%, transparent);
    }
    .groups { display: flex; flex: 1; gap: 6px; min-width: 0; }
    .groups button {
      flex: 1;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: rgba(16,22,28,.9);
      color: var(--text);
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 1px 6px rgba(0,0,0,.28);
    }
    .groups button[aria-pressed="true"] { color: #0b1220; }
    .groups button[data-id="soder"][aria-pressed="true"] { background: var(--soder); }
    .groups button[data-id="mitten"][aria-pressed="true"] { background: var(--mitten); }
    .groups button[data-id="norr"][aria-pressed="true"] { background: var(--norr); }
    .icon-btn {
      width: 44px; height: 44px; flex: none;
      border: 0; border-radius: 12px;
      background: rgba(16,22,28,.9);
      color: var(--text);
      display: grid; place-items: center;
      box-shadow: 0 1px 6px rgba(0,0,0,.28);
    }
    #map {
      position: absolute;
      inset: 0 0 var(--sheet) 0;
      background: var(--bg);
    }
    .leaflet-control-attribution {
      max-width: 46vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 10px !important;
    }
    .leaflet-bottom.leaflet-right { margin-bottom: 8px; }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: var(--sheet);
      background: var(--panel);
      border-top: 1px solid var(--line);
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      z-index: 400;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -8px 24px rgba(0,0,0,.28);
    }
    .handle {
      width: 42px; height: 4px; border-radius: 99px;
      background: #3a4553; margin: 8px auto 2px;
      flex: none;
    }
    .modes {
      display: flex;
      gap: 6px;
      padding: 2px 12px 8px;
      flex: none;
    }
    .modes button {
      flex: 1;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #10161c;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.82rem;
    }
    .modes button[aria-pressed="true"] {
      background: var(--accent);
      color: #0b1220;
      border-color: transparent;
    }
    .now {
      padding: 6px 14px 12px;
      border-bottom: 1px solid var(--line);
      flex: none;
    }
    .now-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .now h2 {
      margin: 0;
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now p { margin: 4px 0 0; color: var(--muted); font-size: 0.8rem; }
    .nav-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 14px; border-radius: 12px;
      background: var(--accent); color: #0b1220;
      font-weight: 800; text-decoration: none; flex: none;
      font-size: 0.95rem;
    }
    .list {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px 18px;
      flex: 1;
    }
    .who { color: var(--muted); font-size: 0.78rem; margin: 0 2px 10px; }
    .stop {
      background: #10161c;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .stop.is-on {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 38%, transparent);
    }
    .stop.is-done { background: #0e1a14; }
    .stop.is-done h3 { color: var(--muted); }
    .stop-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .stop h3 {
      margin: 0 0 4px;
      font-size: 0.95rem;
      display: flex; gap: 8px; align-items: center;
      flex: 1;
      min-width: 0;
    }
    .been {
      width: 44px; height: 44px; flex: none;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #10161c;
      color: var(--muted);
      display: grid; place-items: center;
      padding: 0;
    }
    .been svg { width: 22px; height: 22px; }
    .been[aria-pressed="true"] {
      background: #22c55e;
      border-color: #22c55e;
      color: #052e16;
    }
    .num {
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; color: #0b1220; flex: none;
    }
    .times { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
    .times strong { color: var(--text); }
    .note { font-size: 0.85rem; margin-top: 4px; }
    .note.warn { background: #3a2a08; color: #fde68a; padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
    .leg { color: var(--muted); font-size: 0.72rem; margin: 0 4px 8px; }
    .toast {
      position: fixed; left: 50%; top: calc(var(--header-h) + 8px);
      transform: translateX(-50%);
      background: #e8eef4; color: #0b1220;
      padding: 10px 14px; border-radius: 999px;
      font-weight: 700; z-index: 800; display: none;
      white-space: nowrap;
    }
    .mk-num {
      width: 34px; height: 34px; border-radius: 50%;
      color: #0b1220; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.4);
      font-size: 15px;
    }
    .mk.is-on .mk-num {
      width: 42px; height: 42px; border-width: 3px;
      box-shadow: 0 0 0 4px rgba(255,255,255,.28);
    }
    .mk.is-done .mk-num { background: #22c55e !important; }
    .mk-num svg { width: 18px; height: 18px; display: block; }
    .more {
      position: absolute; right: 10px; top: calc(var(--header-h) + 4px);
      z-index: 450; display: none;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 6px; min-width: 190px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .more a, .more button {
      display: block; width: 100%; text-align: left;
      background: none; border: 0; color: var(--text);
      padding: 12px; font-weight: 700; text-decoration: none;
      font-size: 0.95rem;
    }
    @media (max-width: 859px) and (orientation: landscape) {
      :root { --sheet: 0px; }
      #map { inset: 0 42% 0 0; }
      .sheet {
        left: 58%; width: 42%; height: auto; top: 0; bottom: 0;
        border-radius: 0; border-left: 1px solid var(--line); border-top: 0;
        box-shadow: none;
      }
      .handle { display: none; }
      header { right: 42%; }
    }
    /* Desktop only when it is actually a pointer device — phones that
       report ~980px width would otherwise get the two-column layout. */
    @media (min-width: 860px) and (hover: hover) and (pointer: fine) {
      :root { --sheet: 0px; --header-h: 60px; }
      header {
        position: static;
        background: #111824;
        padding: 8px 16px;
      }
      #map {
        position: absolute;
        top: 60px; left: 380px; right: 0; bottom: 0;
      }
      .sheet {
        position: absolute;
        top: 60px; left: 0; width: 380px; height: auto; bottom: 0;
        border-radius: 0; border-right: 1px solid var(--line); border-top: 0;
        box-shadow: none;
      }
      .handle { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="groups" id="groups"></div>
    <button type="button" class="icon-btn" id="share" aria-label="Kopiera länk" title="Kopiera länk">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
      </svg>
    </button>
    <button type="button" class="icon-btn" id="moreBtn" aria-label="Mer" title="Mer">···</button>
  </header>
  <div id="map"></div>
  <div class="more" id="more">
    <a id="gmaps" target="_blank" rel="noopener">Hela rutten i Maps</a>
    <a id="gpx" href="#" download>Ladda ner GPX</a>
    <button type="button" id="clearDone">Rensa avbockning</button>
  </div>
  <section class="sheet">
    <div class="handle"></div>
    <div class="modes" id="modes">
      <button type="button" data-mode="kortast" aria-pressed="true">Kortast körväg</button>
      <button type="button" data-mode="iga">Igång-tid</button>
    </div>
    <div class="now" id="now"></div>
    <div class="list" id="sidebar"></div>
  </section>
  <div class="toast" id="toast">Länk kopierad</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="routes.js?v=8"></script>
  <script>
    const PUBLIC_BASE = "https://thomazzo91.github.io/hbgm26/";
    const groups = window.HBGM_ROUTES.groups;
    const groupBar = document.getElementById("groups");
    const sidebar = document.getElementById("sidebar");
    const nowEl = document.getElementById("now");
    const modeBar = document.getElementById("modes");
    const gpxLink = document.getElementById("gpx");
    const gmapsLink = document.getElementById("gmaps");
    const toast = document.getElementById("toast");
    const more = document.getElementById("more");
    const map = L.map("map", { tap: true, zoomControl: false, attributionControl: true });
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let layer = L.layerGroup().addTo(map);
    let markers = [];
    let currentId = groups[0].id;
    let currentMode = "kortast";
    let selected = 0;
    let routeLine = null;

    function viewOf(id, mode) {
      const g = groups.find((x) => x.id === id) || groups[0];
      const m = (g.modes && g.modes[mode]) || g.modes.kortast;
      return {
        id: g.id,
        name: g.name,
        ansvarig: g.ansvarig,
        color: g.color,
        km: m.km,
        min: m.min,
        gpx: m.gpx,
        stops: m.stops,
        legs: m.legs,
        track: m.track
      };
    }
    function parseHash() {
      const parts = (location.hash || "#soder").replace(/^#/, "").split("/").filter(Boolean);
      const g = groups.find((x) => x.id === parts[0]) || groups[0];
      let mode = "kortast";
      let i = 1;
      if (parts[1] === "iga") { mode = "iga"; i = 2; }
      const view = viewOf(g.id, mode);
      const n = parseInt(parts[i], 10);
      const idx = Number.isFinite(n) && n >= 1 && n <= view.stops.length ? n - 1 : 0;
      return { id: g.id, mode, idx };
    }
    function hashFor(id, mode, idx) {
      let h = "#" + id;
      if (mode === "iga") h += "/iga";
      if (idx > 0) h += "/" + (idx + 1);
      return h;
    }
    function setHash(id, mode, idx, replace) {
      const hash = hashFor(id, mode, idx);
      if (replace) history.replaceState(null, "", hash);
      else if (location.hash !== hash) history.pushState(null, "", hash);
    }
    function shareUrl() {
      return PUBLIC_BASE.replace(/\/?$/, "/") + hashFor(currentId, currentMode, selected);
    }
    const VISIT_KEY = "hbgm26-visited-v1";
    const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
    let visited = {};
    try { visited = JSON.parse(localStorage.getItem(VISIT_KEY) || "{}") || {}; } catch (e) { visited = {}; }
    function visitKey(groupId, label) { return groupId + "|" + label; }
    function isDone(groupId, label) { return !!visited[visitKey(groupId, label)]; }
    function setDone(groupId, label, on) {
      const k = visitKey(groupId, label);
      if (on) visited[k] = true;
      else delete visited[k];
      try { localStorage.setItem(VISIT_KEY, JSON.stringify(visited)); } catch (e) {}
    }
    function doneCount(g) {
      return g.stops.filter((s) => isDone(g.id, s.label)).length;
    }
    function googleDir(g) {
      return "https://www.google.com/maps/dir/" + g.stops.map((s) => s.lat.toFixed(6) + "," + s.lon.toFixed(6)).join("/");
    }
    function markerIcon(color, n, on, done) {
      return L.divIcon({
        className: "",
        iconSize: on ? [42, 42] : [34, 34],
        iconAnchor: on ? [21, 21] : [17, 17],
        html: `<div class="mk${on ? " is-on" : ""}${done ? " is-done" : ""}"><div class="mk-num" style="background:${color}">${done ? CHECK_SVG : n}</div></div>`
      });
    }
    function showToast(text) {
      toast.textContent = text;
      toast.style.display = "block";
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => { toast.style.display = "none"; }, 1800);
    }
    function isDesktop() {
      return window.matchMedia("(min-width: 860px) and (hover: hover) and (pointer: fine)").matches;
    }
    function mapPad() {
      map.invalidateSize();
      const header = document.querySelector("header").getBoundingClientRect();
      const landscape = !isDesktop() && window.matchMedia("(orientation: landscape)").matches;
      if (isDesktop() || landscape) {
        return { paddingTopLeft: [16, 16], paddingBottomRight: [16, 16] };
      }
      return {
        paddingTopLeft: [18, Math.round(header.height) + 10],
        paddingBottomRight: [18, 18]
      };
    }

    groups.forEach((g) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = g.id;
      b.textContent = g.name;
      b.addEventListener("click", () => show(g.id, currentMode, 0, false));
      groupBar.appendChild(b);
    });
    modeBar.querySelectorAll("button").forEach((b) => {
      b.addEventListener("click", () => {
        const next = b.dataset.mode;
        const prev = viewOf(currentId, currentMode);
        const label = prev.stops[selected] && prev.stops[selected].label;
        const nxt = viewOf(currentId, next);
        const idx = Math.max(0, nxt.stops.findIndex((s) => s.label === label));
        show(currentId, next, idx, false);
      });
    });

    document.getElementById("moreBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      more.style.display = more.style.display === "block" ? "none" : "block";
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#more") && !e.target.closest("#moreBtn")) more.style.display = "none";
    });
    document.getElementById("clearDone").addEventListener("click", () => {
      more.style.display = "none";
      const g = viewOf(currentId, currentMode);
      if (!confirm("Rensa avbockning för " + g.name + "?")) return;
      g.stops.forEach((s) => setDone(g.id, s.label, false));
      paintDone(g);
      showToast("Avbockning rensad");
    });

    function renderNow(g) {
      const s = g.stops[selected];
      const nav = "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lon + "&travelmode=driving";
      nowEl.innerHTML = `
        <div class="now-top">
          <span class="num" style="background:${g.color}">${selected + 1}</span>
          <div style="flex:1;min-width:0">
            <h2>${s.label}</h2>
            <p>${s.setup || ""} · Igång ${s.iga}</p>
          </div>
          <a class="nav-btn" href="${nav}" target="_blank" rel="noopener">Navigera</a>
        </div>`;
    }

    function toggleDone(i) {
      const g = viewOf(currentId, currentMode);
      const s = g.stops[i];
      if (!s) return;
      setDone(g.id, s.label, !isDone(g.id, s.label));
      paintDone(g);
    }

    function paintDone(g) {
      const nDone = doneCount(g);
      const orderHint = currentMode === "iga" ? "i igång-ordning" : "kortaste körvägen";
      const prog = document.getElementById("progress");
      if (prog) prog.textContent = g.ansvarig + " · " + g.km + " km · " + g.min + " min · " + nDone + "/" + g.stops.length + " avbockade · " + orderHint;
      sidebar.querySelectorAll(".stop").forEach((el) => {
        const i = Number(el.dataset.i);
        const s = g.stops[i];
        const done = !!(s && isDone(g.id, s.label));
        el.classList.toggle("is-done", done);
        const btn = el.querySelector(".been");
        if (btn) btn.setAttribute("aria-pressed", String(done));
      });
      markers.forEach((m, n) => {
        const s = g.stops[n];
        m.setIcon(markerIcon(g.color, n + 1, n === selected, !!(s && isDone(g.id, s.label))));
      });
    }

    function show(id, mode, idx, fromHash) {
      const g = viewOf(id, mode);
      currentId = g.id;
      currentMode = mode;
      selected = Math.max(0, Math.min(idx, g.stops.length - 1));
      if (!fromHash) setHash(currentId, currentMode, selected, false);
      document.documentElement.style.setProperty("--accent", g.color);
      [...groupBar.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === g.id)));
      modeBar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === currentMode)));
      gpxLink.href = g.gpx;
      gpxLink.download = g.gpx;
      gmapsLink.href = googleDir(g);

      layer.clearLayers();
      markers = [];
      const latlngs = g.track.map(([lon, lat]) => [lat, lon]);
      routeLine = L.polyline(latlngs, { color: g.color, weight: 6, opacity: 0.92 }).addTo(layer);
      g.stops.forEach((s, i) => {
        const m = L.marker([s.lat, s.lon], {
          icon: markerIcon(g.color, i + 1, i === selected, isDone(g.id, s.label)),
          zIndexOffset: i === selected ? 700 : 0
        });
        m.on("click", () => selectStop(i, true));
        m.addTo(layer);
        markers.push(m);
      });
      map.fitBounds(routeLine.getBounds(), mapPad());
      renderNow(g);
      const orderHint = currentMode === "iga" ? "i igång-ordning" : "kortaste körvägen";
      sidebar.innerHTML = `
        <p class="who" id="progress">${g.ansvarig} · ${g.km} km · ${g.min} min · ${doneCount(g)}/${g.stops.length} avbockade · ${orderHint}</p>
        ${g.stops.map((s, i) => {
          const warn = /kod|fredriksdal|kolla bilden/i.test(s.placering || "");
          const done = isDone(g.id, s.label);
          return `<article class="stop${done ? " is-done" : ""}" data-i="${i}">
            <div class="stop-head">
              <h3><span class="num" style="background:${g.color}">${i + 1}</span>${s.label}</h3>
              <button type="button" class="been" data-i="${i}" aria-pressed="${done}" aria-label="Bocka av ${s.label}">${CHECK_SVG}</button>
            </div>
            <div class="note">${s.setup || ""}</div>
            <div class="times"><span>Igång <strong>${s.iga}</strong></span><span>Första <strong>${s.forsta}</strong></span><span>Sista <strong>${s.sista}</strong></span></div>
            ${s.placering ? `<div class="note${warn ? " warn" : ""}">${s.placering}</div>` : ""}
          </article>${g.legs[i] ? `<div class="leg">${g.legs[i].km} km · ${g.legs[i].min} min till nästa</div>` : ""}`;
        }).join("")}`;
      sidebar.querySelectorAll(".stop").forEach((el) => {
        el.addEventListener("click", () => selectStop(Number(el.dataset.i), true));
      });
      sidebar.querySelectorAll(".been").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          toggleDone(Number(btn.dataset.i));
        });
      });
      paintSelection(fromHash && /\/[1-9]\d*$/.test(location.hash));
      setTimeout(() => {
        if (routeLine) map.fitBounds(routeLine.getBounds(), mapPad());
      }, 250);
    }

    function selectStop(i, pan) {
      const g = viewOf(currentId, currentMode);
      selected = i;
      setHash(currentId, currentMode, selected, true);
      markers.forEach((m, n) => {
        const s = g.stops[n];
        m.setIcon(markerIcon(g.color, n + 1, n === selected, !!(s && isDone(g.id, s.label))));
        m.setZIndexOffset(n === selected ? 800 : 0);
      });
      renderNow(g);
      paintSelection(pan);
    }

    function paintSelection(pan) {
      const g = viewOf(currentId, currentMode);
      sidebar.querySelectorAll(".stop").forEach((el) => {
        const on = Number(el.dataset.i) === selected;
        el.classList.toggle("is-on", on);
        if (on) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      if (pan && g.stops[selected]) {
        map.setView([g.stops[selected].lat, g.stops[selected].lon], Math.max(map.getZoom(), 16), { animate: true });
      }
    }

    document.getElementById("share").addEventListener("click", async (ev) => {
      ev.preventDefault();
      const url = shareUrl();
      if (location.protocol === "https:" && navigator.share) {
        try {
          const g = viewOf(currentId, currentMode);
          await navigator.share({ title: "HBGM 26 " + g.name, text: g.stops[selected].label, url });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast("Länk kopierad");
      } catch {
        prompt("Kopiera länken", url);
      }
    });

    window.addEventListener("hashchange", () => {
      const { id, mode, idx } = parseHash();
      if (id !== currentId || mode !== currentMode) show(id, mode, idx, true);
      else selectStop(idx, true);
    });
    window.addEventListener("resize", () => {
      map.invalidateSize();
      if (routeLine) map.fitBounds(routeLine.getBounds(), mapPad());
    });
    new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));
    const start = parseHash();
    show(start.id, start.mode, start.idx, true);
  </script>
</body>
</html>
