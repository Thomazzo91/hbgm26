<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>HBGM 26 — Körrutter mattor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171e26;
      --line: #2a3440;
      --text: #e8eef4;
      --muted: #93a0ae;
      --soder: #d97706;
      --mitten: #3b82f6;
      --norr: #10b981;
      --safe-top: env(safe-area-inset-top);
      --safe-bot: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: none;
    }
    header h1 { margin: 0; font-size: 1rem; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 0.75rem; }
    .brand { min-width: 0; }
    .groups { display: flex; gap: 8px; flex: 1; }
    .groups button {
      border: 1px solid var(--line);
      background: #10161c;
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
      flex: 1;
    }
    .groups button[aria-pressed="true"] { color: #0b1220; }
    .groups button[data-id="soder"][aria-pressed="true"] { background: var(--soder); border-color: var(--soder); }
    .groups button[data-id="mitten"][aria-pressed="true"] { background: var(--mitten); border-color: var(--mitten); }
    .groups button[data-id="norr"][aria-pressed="true"] { background: var(--norr); border-color: var(--norr); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions a, .actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      border: 0;
      cursor: pointer;
      color: #0b1220;
      background: #e8eef4;
    }
    .actions a.secondary, .actions button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      grid-template-areas: "side map";
    }
    .sidebar { grid-area: side; }
    #map { grid-area: map; min-height: 42vh; }
    .sidebar {
      overflow: auto;
      border-right: 1px solid var(--line);
      padding: 12px 12px calc(20px + var(--safe-bot));
      -webkit-overflow-scrolling: touch;
    }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      background: #10161c;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .stat b { display: block; font-size: 1.1rem; }
    .stat span { color: var(--muted); font-size: 0.75rem; }
    .stop {
      background: #10161c;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      font: inherit;
      display: block;
    }
    .stop.is-on {
      border-width: 2px;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #3b82f6) 35%, transparent);
    }
    .stop h3 {
      margin: 0 0 6px;
      font-size: 0.95rem;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: #0b1220;
      flex: none;
    }
    .times {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.78rem;
      margin: 6px 0;
    }
    .times strong { color: var(--text); }
    .note { font-size: 0.85rem; line-height: 1.35; }
    .note.warn {
      background: #3a2a08;
      color: #fde68a;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .leg { color: var(--muted); font-size: 0.75rem; margin: 6px 2px 10px; }
    .hint { color: var(--muted); font-size: 0.75rem; line-height: 1.4; margin-top: 12px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(16px + var(--safe-bot));
      transform: translateX(-50%);
      background: #e8eef4;
      color: #0b1220;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      z-index: 5000;
      display: none;
    }
    .mk {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .mk-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #0b1220;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.45);
      flex: none;
    }
    .mk.is-on .mk-num {
      width: 38px;
      height: 38px;
      border-width: 4px;
      box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 2px 8px rgba(0,0,0,.5);
    }
    .mk-lab {
      background: #0b1220;
      color: #fff;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(38vh, 46vh) 1fr;
        grid-template-areas: "map" "side";
      }
      .sidebar { border-right: 0; border-top: 1px solid var(--line); }
      .actions { width: 100%; }
      .actions a, .actions button { flex: 1; }
      .mk-lab { display: none; }
      .mk.is-on .mk-lab { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>HBGM 26 körrutter</h1>
      <p>Tryck på ett stopp eller en nål · skicka länken till gruppen</p>
    </div>
    <div class="groups" id="groups"></div>
    <div class="actions">
      <button type="button" id="share" class="secondary">Kopiera länk</button>
      <a id="gmaps" class="secondary" target="_blank" rel="noopener">Google Maps</a>
      <a id="gpx" href="#" download>GPX</a>
    </div>
  </header>
  <main>
    <aside class="sidebar" id="sidebar"></aside>
    <div id="map"></div>
  </main>
  <div class="toast" id="toast">Länk kopierad</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="routes.js"></script>
  <script>
    const groups = window.HBGM_ROUTES.groups;
    const groupBar = document.getElementById("groups");
    const sidebar = document.getElementById("sidebar");
    const gpxLink = document.getElementById("gpx");
    const gmapsLink = document.getElementById("gmaps");
    const toast = document.getElementById("toast");
    const map = L.map("map", { tap: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let layer = L.layerGroup().addTo(map);
    let markers = [];
    let currentId = groups[0].id;
    let selected = 0;

    function parseHash() {
      const raw = (location.hash || "#soder").replace(/^#/, "");
      const [gid, stopRaw] = raw.split("/");
      const g = groups.find((x) => x.id === gid) || groups[0];
      const n = parseInt(stopRaw, 10);
      const idx = Number.isFinite(n) && n >= 1 && n <= g.stops.length ? n - 1 : 0;
      return { id: g.id, idx };
    }

    function setHash(id, idx, replace) {
      const hash = "#" + id + "/" + (idx + 1);
      if (replace) history.replaceState(null, "", hash);
      else if (location.hash !== hash) history.pushState(null, "", hash);
    }

    function shareUrl() {
      return location.origin + location.pathname + location.search + "#" + currentId + "/" + (selected + 1);
    }

    function googleDir(g) {
      const pts = g.stops.map((s) => s.lat.toFixed(6) + "," + s.lon.toFixed(6));
      return "https://www.google.com/maps/dir/" + pts.join("/");
    }

    function markerIcon(color, n, label, on) {
      return L.divIcon({
        className: "",
        iconSize: on ? [240, 38] : [220, 30],
        iconAnchor: on ? [19, 19] : [15, 15],
        html: `<div class="mk${on ? " is-on" : ""}"><div class="mk-num" style="background:${color}">${n}</div><div class="mk-lab">${n}. ${label}</div></div>`
      });
    }

    function showToast(text) {
      toast.textContent = text;
      toast.style.display = "block";
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => { toast.style.display = "none"; }, 1800);
    }

    groups.forEach((g) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = g.id;
      b.textContent = g.name;
      b.addEventListener("click", () => show(g.id, 0, false));
      groupBar.appendChild(b);
    });

    function show(id, idx, fromHash) {
      const g = groups.find((x) => x.id === id) || groups[0];
      currentId = g.id;
      selected = Math.max(0, Math.min(idx, g.stops.length - 1));
      if (!fromHash) setHash(currentId, selected, false);
      document.documentElement.style.setProperty("--accent", g.color);
      [...groupBar.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === g.id)));
      gpxLink.href = g.gpx;
      gpxLink.download = g.gpx;
      gmapsLink.href = googleDir(g);

      layer.clearLayers();
      markers = [];
      const latlngs = g.track.map(([lon, lat]) => [lat, lon]);
      const line = L.polyline(latlngs, { color: g.color, weight: 5, opacity: 0.9 }).addTo(layer);
      g.stops.forEach((s, i) => {
        const m = L.marker([s.lat, s.lon], {
          icon: markerIcon(g.color, i + 1, s.label, i === selected),
          zIndexOffset: i === selected ? 600 : 0
        });
        m.on("click", () => selectStop(i, true));
        m.addTo(layer);
        markers.push(m);
      });
      map.fitBounds(line.getBounds(), { padding: [28, 28] });

      sidebar.innerHTML = `
        <div class="summary">
          <div class="stat"><b>${g.name}</b><span>${g.ansvarig}</span></div>
          <div class="stat"><b>${g.km} km</b><span>${g.min} min · ${g.stops.length} stopp</span></div>
        </div>
        ${g.stops.map((s, i) => {
          const setup = s.setup || ("Tidtagningsmatta " + s.label);
          const warn = /kod|fredriksdal|kolla bilden/i.test(s.placering || "");
          const nav = "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lon + "&travelmode=driving";
          return `<article class="stop" data-i="${i}" tabindex="0" style="--accent:${g.color}">
            <h3><span class="num" style="background:${g.color}">${i + 1}</span>${s.label}</h3>
            <div class="note">Sätt upp: ${setup}</div>
            <div class="times">
              <span>Igång <strong>${s.iga}</strong></span>
              <span>Första <strong>${s.forsta}</strong></span>
              <span>Sista <strong>${s.sista}</strong></span>
            </div>
            ${s.placering ? `<div class="note${warn ? " warn" : ""}">${s.placering}</div>` : ""}
            <div class="times"><a href="${nav}" target="_blank" rel="noopener">Navigera hit</a></div>
          </article>${g.legs[i] ? `<div class="leg">Kör ${g.legs[i].km} km · ${g.legs[i].min} min till nästa</div>` : ""}`;
        }).join("")}
        <p class="hint">Tryck på en nål eller ett kort. Skicka länken så öppnas rätt grupp och stopp.</p>
      `;
      sidebar.querySelectorAll(".stop").forEach((el) => {
        const pick = (ev) => {
          if (ev.target.closest("a")) return;
          selectStop(Number(el.dataset.i), true);
        };
        el.addEventListener("click", pick);
        el.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            selectStop(Number(el.dataset.i), true);
          }
        });
      });
      paintSelection(fromHash && /\/[1-9]\d*$/.test(location.hash));
      setTimeout(() => map.invalidateSize(), 150);
    }

    function selectStop(i, pan) {
      const g = groups.find((x) => x.id === currentId);
      selected = i;
      setHash(currentId, selected, true);
      markers.forEach((m, n) => {
        m.setIcon(markerIcon(g.color, n + 1, g.stops[n].label, n === selected));
        m.setZIndexOffset(n === selected ? 700 : 0);
      });
      paintSelection(pan);
    }

    function paintSelection(pan) {
      const g = groups.find((x) => x.id === currentId);
      sidebar.querySelectorAll(".stop").forEach((el) => {
        const on = Number(el.dataset.i) === selected;
        el.classList.toggle("is-on", on);
        if (on) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      if (pan && g.stops[selected]) {
        map.setView([g.stops[selected].lat, g.stops[selected].lon], Math.max(map.getZoom(), 16), { animate: true });
      }
    }

    document.getElementById("share").addEventListener("click", async () => {
      const url = shareUrl();
      try {
        if (navigator.share) {
          const g = groups.find((x) => x.id === currentId);
          await navigator.share({
            title: "HBGM 26 " + g.name,
            text: g.name + " · stopp " + (selected + 1) + ". " + g.stops[selected].label,
            url
          });
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast("Länk kopierad");
      } catch {
        prompt("Kopiera länken", url);
      }
    });

    window.addEventListener("hashchange", () => {
      const { id, idx } = parseHash();
      if (id !== currentId) show(id, idx, true);
      else selectStop(idx, true);
    });

    const start = parseHash();
    show(start.id, start.idx, true);
  </script>
</body>
</html>
